[workspace]
members = [
  "lib",
  "cli"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Cabbage <33714346+pycabbage@users.noreply.github.com>"]
repository = "https://github.com/pycabbage/nksf-parser"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
